<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Page</title>
    <meta name="theme-color" content="#0b0d12">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link data-trunk rel="rust" data-bin="status-page" data-type="main" />
    <link data-trunk rel="copy-file" href="how.html" />
    <link data-trunk rel="copy-file" href="privacy.html" />
    <link data-trunk rel="copy-file" href="privacy-en.html" />
    <link data-trunk rel="copy-file" href="favicon.ico" />
    <link data-trunk rel="copy-file" href="logo.png" />
    <link data-trunk rel="copy-dir" href="assets/icons" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        frkn: {
                            bg: '#050505',
                            card: '#111215',
                            text: '#f4f4f5',
                            muted: '#8b949e',
                            accent: '#0066ff',
                            accent2: '#7aa7ff',
                            border: 'rgba(255,255,255,0.08)',
                        }
                    },
                    fontFamily: {
                        sans: ['IBM Plex Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                        mono: ['IBM Plex Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Mirrors frkn.org home-v2: OLED black, #0066ff accent, IBM Plex Mono,
           18px cards with a soft gradient and a thin blue hairline. */
        :root {
            --frkn-bg: #050505;
            --frkn-card: #111215;
            --frkn-text: #f4f4f5;
            --frkn-muted: #8b949e;
            --frkn-accent: #0066ff;
            --frkn-accent2: #7aa7ff;
            --frkn-border: rgba(255, 255, 255, 0.08);
            --frkn-line-strong: rgba(255, 255, 255, 0.14);
        }
        body {
            background:
                radial-gradient(900px 520px at 50% -180px, rgba(0, 102, 255, 0.16), transparent 70%),
                var(--frkn-bg);
            color: var(--frkn-text);
            font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
        }
        .frkn-card {
            background: linear-gradient(145deg, #12141a 0%, #0a0b0e 100%);
            border: 1px solid var(--frkn-border);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        }
        .frkn-card:hover {
            border-color: var(--frkn-line-strong);
        }
        .frkn-gradient-text {
            background: linear-gradient(90deg, var(--frkn-accent), var(--frkn-accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .frkn-gradient-border {
            position: relative;
            overflow: hidden;
        }
        .frkn-gradient-border::before {
            content: "";
            position: absolute;
            top: 0;
            left: 12%;
            right: 12%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 102, 255, 0.3) 12%, rgba(122, 167, 255, 0.9) 50%, rgba(0, 102, 255, 0.3) 88%, transparent);
            box-shadow: 0 0 14px rgba(0, 102, 255, 0.35);
        }
        .frkn-btn {
            background: rgba(0, 102, 255, 0.28);
            border-radius: 11px;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.16);
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        .frkn-btn:hover {
            background: rgba(0, 102, 255, 0.38);
            box-shadow: 0 0 26px rgba(0, 102, 255, 0.28);
        }
        .service-icon svg {
            width: 32px;
            height: 32px;
            fill: #f4f4f5 !important;
        }
        .pulse-dot {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="min-h-screen antialiased">
    <div id="app"></div>
</body>
</html>
